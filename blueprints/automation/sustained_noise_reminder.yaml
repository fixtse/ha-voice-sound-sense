blueprint:
  name: "SoundSense — Sustained noise reminder"
  description: >-
    Notify after the relative sound level stays above your chosen threshold during allowed hours. Values are device-relative, not calibrated dB SPL. One notification per continuous episode, subject to cooldown.
    Sound activity is not confirmed human occupancy. Require fresh SoundSense
    measurement and timestamp entities. Persistence restarts after reload/restart.
  domain: automation
  author: fixtse
  homeassistant:
    min_version: "2026.11.0"
  source_url: https://github.com/fixtse/ha-voice-sound-sense/blob/main/blueprints/automation/sustained_noise_reminder.yaml
  input:
    measurement_active:
      name: Sound measurement active
      description: Select SoundSense's measurement-active binary sensor, not a presence sensor.
      selector:
        entity:
          filter:
            domain: binary_sensor
    last_sample:
      name: Last audio sample
      description: Select SoundSense's timestamp sensor. Unknown or stale timestamps block activity.
      selector:
        entity:
          filter:
            domain: sensor
            device_class: timestamp
    fresh_seconds:
      name: Maximum sample age
      default: 10
      selector:
        number:
          min: 5
          max: 60
          unit_of_measurement: seconds
          mode: box
    ignored_appliances:
      name: Ignore activity while these appliances are running
      description: Active/on/running/cleaning states block detection. Unknown or unavailable entities also block it.
      default: []
      selector:
        entity:
          multiple: true
    ignored_players:
      name: Ignore activity while these media players are playing
      description: Include TVs and nearby speakers. Unknown or unavailable players block detection too.
      default: []
      selector:
        entity:
          multiple: true
          filter:
            domain: media_player
    sound_level:
      name: Ambient Sound Level
      selector:
        entity:
          filter:
            domain: sensor
    threshold:
      name: Relative sound threshold
      description: Tune to this device and room; this is not an acoustic SPL limit.
      default: 55
      selector:
        number:
          min: 0
          max: 115
          step: 1
          mode: box
    start_time:
      name: Allowed hours start
      default: "08:00:00"
      selector:
        time:
    end_time:
      name: Allowed hours end
      description: Overnight windows are supported. Equal start and end means all day.
      default: "22:00:00"
      selector:
        time:
    room_name:
      name: Room or device name
      default: this room
      selector:
        text:
    persistence:
      name: Continuous qualifying activity required
      default:
        minutes: 5
      selector:
        duration:
    cooldown_minutes:
      name: Minimum time between notifications
      default: 60
      selector:
        number:
          min: 1
          max: 1440
          unit_of_measurement: minutes
          mode: box
    additional_conditions:
      name: Optional additional conditions
      description: For example, corroboration from another sensor. Checked before notifying.
      default: []
      selector:
        condition:
    notification_actions:
      name: Notification action
      description: Defaults to a Home Assistant notification. For phone actions use sound_title and sound_message in the title/message templates.
      default:
        - action: persistent_notification.create
          data:
            title: "{{ sound_title }}"
            message: "{{ sound_message }}"
            notification_id: "{{ this.entity_id }}_sound"
      selector:
        action:
trigger_variables:
  measurement_entity: !input measurement_active
  sample_entity: !input last_sample
  fresh_seconds: !input fresh_seconds
  ignored_appliances: !input ignored_appliances
  ignored_players: !input ignored_players
  level_entity: !input sound_level
  threshold: !input threshold
  start_time: !input start_time
  end_time: !input end_time
variables:
  cooldown_minutes: !input cooldown_minutes
  room_name: !input room_name
  sound_title: Sustained sound activity
  sound_message: "Sound stayed above the configured relative threshold in {{ room_name }}. The reading is device-relative, not calibrated dB SPL."
triggers:
  - trigger: template
    value_template: >-
      {% set age = as_timestamp(now()) - as_timestamp(states(sample_entity), 0) %}
      {% set ns = namespace(ok=is_state(measurement_entity, 'on') and -2 <= age <= fresh_seconds|float) %}
      {% for entity in ignored_appliances %}
        {% if states(entity) in ['on', 'active', 'running', 'cleaning', 'returning', 'playing', 'buffering', 'unknown', 'unavailable'] %}
          {% set ns.ok = false %}
        {% endif %}
      {% endfor %}
      {% for entity in ignored_players %}
        {% if states(entity) not in ['off', 'idle', 'paused', 'standby'] %}{% set ns.ok = false %}{% endif %}
      {% endfor %}
      {% set current = now().strftime('%H:%M:%S') %}
      {% set in_hours = start_time == end_time or (start_time <= current < end_time if start_time < end_time else current >= start_time or current < end_time) %}
      {{ ns.ok and in_hours and is_number(states(level_entity)) and states(level_entity)|float(0) > threshold|float }}
    for: !input persistence
conditions:
  - condition: template
    value_template: >-
      {{ as_timestamp(now()) - as_timestamp(this.attributes.get('last_triggered'), 0) >= cooldown_minutes|float * 60 }}
  - condition: and
    conditions: !input additional_conditions
actions: !input notification_actions
mode: single
max_exceeded: silent
