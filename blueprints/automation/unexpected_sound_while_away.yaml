blueprint:
  name: "SoundSense — Unexpected sound while away"
  description: >-
    Send an informational notification after sustained sound while all selected people are away. Never identifies an intruder. One notification per continuous episode, subject to cooldown.
    Sound activity is not confirmed human occupancy. Require fresh SoundSense
    measurement and timestamp entities. Persistence restarts after reload/restart.
  domain: automation
  author: fixtse
  homeassistant:
    min_version: "2026.11.0"
  source_url: https://github.com/fixtse/ha-voice-sound-sense/blob/main/blueprints/automation/unexpected_sound_while_away.yaml
  input:
    measurement_active:
      name: Sound measurement active
      description: Select SoundSense's measurement-active binary sensor, not a presence sensor.
      selector:
        entity:
          filter:
            domain: binary_sensor
    last_sample:
      name: Last audio sample
      description: Select SoundSense's timestamp sensor. Unknown or stale timestamps block activity.
      selector:
        entity:
          filter:
            domain: sensor
            device_class: timestamp
    fresh_seconds:
      name: Maximum sample age
      default: 10
      selector:
        number:
          min: 5
          max: 60
          unit_of_measurement: seconds
          mode: box
    ignored_appliances:
      name: Ignore activity while these appliances are running
      description: Active/on/running/cleaning states block detection. Unknown or unavailable entities also block it.
      default: []
      selector:
        entity:
          multiple: true
    ignored_players:
      name: Ignore activity while these media players are playing
      description: Include TVs and nearby speakers. Unknown or unavailable players block detection too.
      default: []
      selector:
        entity:
          multiple: true
          filter:
            domain: media_player
    sound_sensor:
      name: Sound Detection
      selector:
        entity:
          filter:
            domain: sensor
    activity_states:
      name: Sound states to count as activity
      default: [presence]
      selector:
        select:
          multiple: true
          options: [presence, active, noise]
    people:
      name: People who must all be away
      description: Select everyone who can be home. Empty, unknown or unavailable person states block notifications.
      selector:
        entity:
          multiple: true
          filter:
            domain: person
    room_name:
      name: Room or device name
      default: this room
      selector:
        text:
    persistence:
      name: Continuous qualifying activity required
      default:
        minutes: 1
      selector:
        duration:
    cooldown_minutes:
      name: Minimum time between notifications
      default: 30
      selector:
        number:
          min: 1
          max: 1440
          unit_of_measurement: minutes
          mode: box
    additional_conditions:
      name: Optional additional conditions
      description: For example, corroboration from another sensor. Checked before notifying.
      default: []
      selector:
        condition:
    notification_actions:
      name: Notification action
      description: Defaults to a Home Assistant notification. For phone actions use sound_title and sound_message in the title/message templates.
      default:
        - action: persistent_notification.create
          data:
            title: "{{ sound_title }}"
            message: "{{ sound_message }}"
            notification_id: "{{ this.entity_id }}_sound"
      selector:
        action:
trigger_variables:
  measurement_entity: !input measurement_active
  sample_entity: !input last_sample
  fresh_seconds: !input fresh_seconds
  ignored_appliances: !input ignored_appliances
  ignored_players: !input ignored_players
  sound_entity: !input sound_sensor
  activity_states: !input activity_states
  people: !input people
variables:
  cooldown_minutes: !input cooldown_minutes
  room_name: !input room_name
  sound_title: Sound activity detected while away
  sound_message: "Sound activity detected in {{ room_name }} while the selected people are away. This is acoustic activity, not confirmed human presence."
triggers:
  - trigger: template
    value_template: >-
      {% set age = as_timestamp(now()) - as_timestamp(states(sample_entity), 0) %}
      {% set ns = namespace(ok=is_state(measurement_entity, 'on') and -2 <= age <= fresh_seconds|float) %}
      {% for entity in ignored_appliances %}
        {% if states(entity) in ['on', 'active', 'running', 'cleaning', 'returning', 'playing', 'buffering', 'unknown', 'unavailable'] %}
          {% set ns.ok = false %}
        {% endif %}
      {% endfor %}
      {% for entity in ignored_players %}
        {% if states(entity) not in ['off', 'idle', 'paused', 'standby'] %}{% set ns.ok = false %}{% endif %}
      {% endfor %}
      {% if people|length == 0 %}{% set ns.ok = false %}{% endif %}
      {% for person in people %}
        {% if states(person) in ['home', 'unknown', 'unavailable'] %}{% set ns.ok = false %}{% endif %}
      {% endfor %}
      {{ ns.ok and states(sound_entity) in activity_states }}
    for: !input persistence
conditions:
  - condition: template
    value_template: >-
      {{ as_timestamp(now()) - as_timestamp(this.attributes.get('last_triggered'), 0) >= cooldown_minutes|float * 60 }}
  - condition: and
    conditions: !input additional_conditions
actions: !input notification_actions
mode: single
max_exceeded: silent
